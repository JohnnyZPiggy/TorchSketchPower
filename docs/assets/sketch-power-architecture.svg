<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="318" viewBox="0 0 1180 318" role="img" aria-labelledby="title desc">
<title id="title">TorchSketchPower tensor pipeline</title><desc id="desc">Resident matrix A is sketched into Y, Z and W, followed by QR-stabilized subspace iteration, corange least squares, and a small singular value decomposition.</desc>
<rect width="1180" height="318" rx="22" fill="#f8fafc"/>
<text x="48" y="52" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Sketch-Power Iteration</text>
<text x="48" y="78" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Tensorized low-rank approximation · Native PyTorch</text>
<g font-family="Arial, sans-serif" text-anchor="middle">
<rect x="38" y="124" width="144" height="108" rx="14" fill="#0f766e"/><text x="110" y="164" font-size="21" font-weight="700" fill="white">A</text><text x="110" y="191" font-size="13" fill="#ccfbf1">Input matrix</text>
<rect x="235" y="124" width="185" height="108" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="327" y="162" font-size="17" font-weight="700" fill="#075985">Random sketches</text><text x="327" y="189" font-size="16" fill="#0369a1">Y, Z, W</text>
<rect x="475" y="124" width="190" height="108" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="570" y="158" font-size="17" font-weight="700" fill="#166534">Subspace iteration</text><text x="570" y="188" font-size="15" fill="#166534">QR · ZᴴQ · ZM</text><text x="570" y="210" font-size="12" fill="#15803d">t power steps</text>
<rect x="720" y="124" width="185" height="108" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="812" y="158" font-size="17" font-weight="700" fill="#5b21b6">Corange solve</text><text x="812" y="188" font-size="14" fill="#6d28d9">min ‖(ΨQ)B − W‖</text><text x="812" y="210" font-size="12" fill="#6d28d9">Rank and condition checks</text>
<rect x="960" y="124" width="180" height="108" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1050" y="160" font-size="17" font-weight="700" fill="#9a3412">Small SVD</text><text x="1050" y="188" font-size="16" fill="#c2410c">U · Σ · Vᴴ</text><text x="1050" y="209" font-size="12" fill="#c2410c">Rank-r approximation</text>
</g><g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M184 178 H227"/><path d="M412 178 H467"/><path d="M667 178 H712"/><path d="M907 178 H952"/>
</g><g fill="#64748b"><path d="M227 178 l-9 -6 v12z"/><path d="M467 178 l-9 -6 v12z"/><path d="M712 178 l-9 -6 v12z"/><path d="M952 178 l-9 -6 v12z"/></g>
<text x="48" y="279" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Input sketches → stabilized range → checked recovery → low-rank factors</text>
